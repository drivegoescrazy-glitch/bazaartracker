name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release jar
        run: gradle --no-daemon clean releaseJar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: BazaarTracker-${{ github.sha }}
          path: release/BazaarTracker-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release jar
        run: gradle --no-daemon clean releaseJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/BazaarTracker-*.jar
          generate_release_notes: true
